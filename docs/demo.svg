<svg xmlns="http://www.w3.org/2000/svg" width="700" height="550" viewBox="0 0 700 550" role="img" aria-label="dotcleaner menu in Terminal">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}</style>
<rect width="700" height="550" rx="10" fill="#0d1117"/>
<rect width="700" height="34" rx="10" fill="#161b22"/><rect y="24" width="700" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="350.0" y="22" fill="#7d8590" text-anchor="middle" style="font-size:12px">Terminal — dotcleaner</text>
<text x="20" y="56" xml:space="preserve"><tspan fill="#7d8590">$ </tspan><tspan fill="#e6edf3">dotcleaner</tspan></text>
<text x="20" y="76" xml:space="preserve"><tspan fill="#e6edf3" font-weight="bold">dotcleaner 2.0.0</tspan><tspan fill="#7d8590"> — clean macOS junk from SD cards &amp; USB drives</tspan></text>
<text x="20" y="96" xml:space="preserve"><tspan fill="#7d8590">==========================================================</tspan></text>
<text x="20" y="136" xml:space="preserve"><tspan fill="#e6edf3">  Drive    </tspan><tspan fill="#e6edf3" font-weight="bold">EASYROMS</tspan><tspan fill="#7d8590"> (/Volumes/EASYROMS, exfat, 29.7 GB)</tspan></text>
<text x="20" y="156" xml:space="preserve"><tspan fill="#e6edf3">  Options  [ ] Windows files   [ ] Keep Trash   [x] Eject when done</tspan></text>
<text x="20" y="196" xml:space="preserve"><tspan fill="#e6edf3">  1) Choose a drive</tspan></text>
<text x="20" y="216" xml:space="preserve"><tspan fill="#e6edf3">  2) Options</tspan></text>
<text x="20" y="236" xml:space="preserve"><tspan fill="#e6edf3">  3) Scan </tspan><tspan fill="#7d8590">(preview, deletes nothing)</tspan></text>
<text x="20" y="256" xml:space="preserve"><tspan fill="#e6edf3">  4) Clean</tspan></text>
<text x="20" y="276" xml:space="preserve"><tspan fill="#e6edf3">  h) Help    q) Quit</tspan></text>
<text x="20" y="316" xml:space="preserve"><tspan fill="#e6edf3">Your choice: </tspan><tspan fill="#79c0ff">4</tspan></text>
<text x="20" y="356" xml:space="preserve"><tspan fill="#e6edf3" font-weight="bold">/Volumes/EASYROMS</tspan></text>
<text x="20" y="376" xml:space="preserve"><tspan fill="#e6edf3">    1342  ._* files (AppleDouble)</tspan></text>
<text x="20" y="396" xml:space="preserve"><tspan fill="#e6edf3">      37  .DS_Store</tspan></text>
<text x="20" y="416" xml:space="preserve"><tspan fill="#e6edf3">       3  macOS system items (.Spotlight-V100, .Trashes, __MACOSX...)</tspan></text>
<text x="20" y="436" xml:space="preserve"><tspan fill="#7d8590">  ------</tspan></text>
<text x="20" y="456" xml:space="preserve"><tspan fill="#e6edf3" font-weight="bold">  Total: 1382 items, 41.6 MB</tspan></text>
<text x="20" y="476" xml:space="preserve"><tspan fill="#e6edf3">  Delete 1382 items? This cannot be undone. [y/N] </tspan><tspan fill="#79c0ff">y</tspan></text>
<text x="20" y="496" xml:space="preserve"><tspan fill="#3fb950">  Done: 1382 items deleted (41.6 MB freed).</tspan></text>
<text x="20" y="516" xml:space="preserve"><tspan fill="#3fb950">  /Volumes/EASYROMS ejected: you can unplug it.</tspan></text>
</svg>
