<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-label="dotcleaner cleaning an SD card in Terminal">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;white-space:pre}</style>
<rect width="640" height="410" rx="10" fill="#0d1117"/>
<rect width="640" height="34" rx="10" fill="#161b22"/><rect y="24" width="640" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="320.0" y="22" fill="#7d8590" text-anchor="middle" style="font-size:12px">Terminal — dotcleaner</text>
<text x="22" y="56" xml:space="preserve"><tspan fill="#7d8590">$ </tspan><tspan fill="#e6edf3">dotcleaner -e</tspan></text>
<text x="22" y="77" xml:space="preserve"><tspan fill="#e6edf3" font-weight="bold">dotcleaner 1.1.0</tspan></text>
<text x="22" y="98" xml:space="preserve"><tspan fill="#e6edf3">Which card do you want to clean?</tspan></text>
<text x="22" y="119" xml:space="preserve"><tspan fill="#e6edf3">  1) /Volumes/EASYROMS</tspan></text>
<text x="22" y="140" xml:space="preserve"><tspan fill="#e6edf3">  2) /Volumes/SHARE</tspan></text>
<text x="22" y="161" xml:space="preserve"><tspan fill="#e6edf3">Number (Enter to cancel): </tspan><tspan fill="#79c0ff">1</tspan></text>
<text x="22" y="203" xml:space="preserve"><tspan fill="#e6edf3" font-weight="bold">/Volumes/EASYROMS</tspan></text>
<text x="22" y="224" xml:space="preserve"><tspan fill="#e6edf3">    1342  ._* files (AppleDouble)</tspan></text>
<text x="22" y="245" xml:space="preserve"><tspan fill="#e6edf3">      37  .DS_Store</tspan></text>
<text x="22" y="266" xml:space="preserve"><tspan fill="#e6edf3">       3  macOS system items (.Spotlight-V100, .Trashes...)</tspan></text>
<text x="22" y="287" xml:space="preserve"><tspan fill="#7d8590">  ------</tspan></text>
<text x="22" y="308" xml:space="preserve"><tspan fill="#e6edf3" font-weight="bold">  Total: 1382 items, 41.6 MB</tspan></text>
<text x="22" y="329" xml:space="preserve"><tspan fill="#e6edf3">  Delete 1382 items? [y/N] </tspan><tspan fill="#79c0ff">y</tspan></text>
<text x="22" y="350" xml:space="preserve"><tspan fill="#3fb950">  Done: 1382 items deleted (41.6 MB freed).</tspan></text>
<text x="22" y="371" xml:space="preserve"><tspan fill="#3fb950">  /Volumes/EASYROMS ejected, you can remove the card.</tspan></text>
</svg>
