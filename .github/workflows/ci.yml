name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ShellCheck & version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -s sh dotcleaner.sh install.sh dotcleaner.command tests/run_tests.sh
      - name: VERSION matches the latest CHANGELOG entry
        run: |
          script=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' dotcleaner.sh)
          changelog=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          echo "dotcleaner.sh: $script / CHANGELOG.md: $changelog"
          [ "$script" = "$changelog" ]

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests with sh
        run: sh tests/run_tests.sh
      - name: Tests with bash
        run: sh tests/run_tests.sh bash

  busybox:
    name: Tests (BusyBox, like on a console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Tests with BusyBox sh and BusyBox tools only
        run: |
          BB=$(command -v busybox)
          mkdir -p "$RUNNER_TEMP/bb"
          "$BB" --install -s "$RUNNER_TEMP/bb"
          PATH="$RUNNER_TEMP/bb" "$BB" sh tests/run_tests.sh "$BB sh"
