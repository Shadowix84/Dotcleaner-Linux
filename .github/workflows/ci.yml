name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ShellCheck & version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -s sh dotcleaner.sh install.sh dotcleaner.command tests/run_tests.sh tests/macos_card.sh tools/make_console.sh console/Dotcleaner.sh
      - name: Shell scripts are pure ASCII (console screens, strict shells)
        run: "! grep -nP '[^\\x00-\\x7F]' dotcleaner.sh install.sh dotcleaner.command console/Dotcleaner.sh"
      - name: Console launchers are up to date (tools/make_console.sh)
        run: sh tools/make_console.sh && git diff --exit-code console/
      - name: Same VERSION in the script, the app and the CHANGELOG
        run: |
          script=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' dotcleaner.sh)
          app=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' app/dotcleaner_core.py)
          changelog=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          echo "dotcleaner.sh: $script / app: $app / CHANGELOG.md: $changelog"
          [ "$script" = "$changelog" ] && [ "$app" = "$changelog" ]
      - name: Same cleaning rules in the script and the app
        run: |
          for name in ._ .DS_Store .apdisk .Spotlight-V100 .Trashes .fseventsd .TemporaryItems \
                      .DocumentRevisions-V100 .AppleDouble .AppleDB .AppleDesktop __MACOSX \
                      Thumbs.db ehthumbs.db desktop.ini; do
            grep -q -- "$name" dotcleaner.sh && grep -q -- "\"$name" app/dotcleaner_core.py \
              || { echo "rule '$name' missing in one engine"; exit 1; }
          done

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tests with sh
        run: sh tests/run_tests.sh
      - name: Tests with bash
        run: sh tests/run_tests.sh bash
      - name: Deletion audit (sh)
        run: python3 tests/audit.py --shell sh --cards 300 --seed ${{ github.run_number }}
      - name: Deletion audit (bash)
        run: python3 tests/audit.py --shell bash --cards 300 --seed 7${{ github.run_number }}
      - name: Deletion audit (console launcher with progress screen)
        run: python3 tests/audit.py --engine console --shell sh --cards 200 --seed 5${{ github.run_number }}
      - name: Real exFAT / FAT32 cards (macOS only)
        if: runner.os == 'macOS'
        run: sh tests/macos_card.sh

  busybox:
    name: Tests (BusyBox, like on a console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Tests with BusyBox sh and BusyBox tools only
        run: |
          BB=$(command -v busybox)
          mkdir -p "$RUNNER_TEMP/bb"
          "$BB" --install -s "$RUNNER_TEMP/bb"
          PATH="$RUNNER_TEMP/bb" "$BB" sh tests/run_tests.sh "$BB sh"
      - name: Deletion audit with BusyBox tools
        run: |
          BB=$(command -v busybox)
          PATH="$RUNNER_TEMP/bb:$PATH" python3 tests/audit.py --shell "$BB sh" --cards 300 --seed 9${{ github.run_number }}
          PATH="$RUNNER_TEMP/bb:$PATH" python3 tests/audit.py --engine console --shell "$BB sh" --cards 150 --seed 3${{ github.run_number }}

  shells:
    name: Tests (other shells)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [mksh, posh, yash, ksh, "zsh --emulate sh"]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mksh posh yash ksh zsh
      - run: sh tests/run_tests.sh "${{ matrix.shell }}"
