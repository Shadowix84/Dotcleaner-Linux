name: Apps (.dmg / .exe)

# Tests the Python engine and the desktop app on macOS, Windows and Linux,
# then builds dotcleaner-x.y.z-macos.dmg and dotcleaner-x.y.z-windows.exe.
# The built files are available under "Artifacts" on each run, and are
# attached to the GitHub release by release.yml.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Engine audit & app tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deletion audit of the app engine
        run: python tests/audit.py --engine python --cards 300 --seed ${{ github.run_number }}
      - name: Install Qt
        run: python -m pip install PySide6-Essentials
      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: App tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_app.py

  macos:
    name: Build .dmg (macOS)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PySide6-Essentials pyinstaller
      - name: Build dotcleaner.app
        run: |
          pyinstaller --noconfirm --windowed --name dotcleaner \
            --icon assets/icon.icns \
            --osx-bundle-identifier io.github.shadowix84.dotcleaner \
            --add-data "assets/icon.png:assets" \
            app/dotcleaner_gui.py
      - name: Self-test of the app
        run: dist/dotcleaner.app/Contents/MacOS/dotcleaner --selftest
      - name: Build the .dmg
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' app/dotcleaner_core.py)
          mkdir dmg
          cp -R dist/dotcleaner.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "dotcleaner $VERSION" -srcfolder dmg -ov -format UDZO "dotcleaner-$VERSION-macos.dmg"
          echo "DMG=dotcleaner-$VERSION-macos.dmg" >> "$GITHUB_ENV"
      - name: Test the .dmg (mount it, run the app from it, unmount)
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/dcdmg "$DMG"
          /tmp/dcdmg/dotcleaner.app/Contents/MacOS/dotcleaner --selftest
          test -L /tmp/dcdmg/Applications
          hdiutil detach /tmp/dcdmg
          ls -lh "$DMG"
      - name: Screenshots (native macOS look)
        run: dist/dotcleaner.app/Contents/MacOS/dotcleaner --screenshots screenshots-macos
      - uses: actions/upload-artifact@v4
        with:
          name: dotcleaner-macos
          path: "*.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots-macos

  windows:
    name: Build .exe (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PySide6-Essentials pyinstaller
      - name: Build dotcleaner.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name dotcleaner
          --icon assets/icon.ico
          --add-data "assets/icon.png;assets"
          app/dotcleaner_gui.py
      - name: Self-test of the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\dotcleaner.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed ($($p.ExitCode))"; exit 1 }
          $v = (Select-String -Path app\dotcleaner_core.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          Copy-Item dist\dotcleaner.exe "dotcleaner-$v-windows.exe"
          Get-Item "dotcleaner-$v-windows.exe" | Format-List Name, Length
      - name: Screenshots (native Windows look)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\dotcleaner.exe -ArgumentList '--screenshots','screenshots-windows' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: dotcleaner-windows
          path: "*.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots-windows
