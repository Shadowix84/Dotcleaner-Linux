name: Apps (.dmg / .exe)

# Tests the Python engine and the desktop app on macOS, Windows and Linux,
# then builds dotcleaner-x.y.z-macos.dmg and dotcleaner-x.y.z-windows.exe.
# The built files are available under "Artifacts" on each run, and are
# attached to the GitHub release by release.yml.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: "Also update the README screenshots (docs/app-*.png) with the macOS ones"
        type: boolean
        default: false
  workflow_call:

jobs:
  test:
    name: Engine audit & app tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deletion audit of the app engine
        run: python tests/audit.py --engine python --cards 300 --seed ${{ github.run_number }}
      - name: Install Qt
        run: python -m pip install PySide6-Essentials
      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: App tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_app.py

  macos:
    name: Build .dmg (macOS)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PySide6-Essentials pyinstaller
      - name: Build Dotcleaner.app
        run: |
          pyinstaller --noconfirm --windowed --name Dotcleaner \
            --icon assets/icon.icns \
            --osx-bundle-identifier io.github.shadowix84.dotcleaner \
            --add-data "assets/icon.png:assets" \
            app/dotcleaner_gui.py
      - name: Version, copyright and category in the app (Info.plist), then sign again
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' app/dotcleaner_core.py)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PLIST=dist/Dotcleaner.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$PLIST"
          plutil -replace CFBundleDisplayName -string "Dotcleaner" "$PLIST"
          plutil -replace NSHumanReadableCopyright -string "© 2026 Shadowix84 · MIT License" "$PLIST"
          plutil -replace LSApplicationCategoryType -string "public.app-category.utilities" "$PLIST"
          plutil -replace NSRemovableVolumesUsageDescription -string "Dotcleaner cleans the junk files on your SD cards and USB drives." "$PLIST"
          codesign --force --deep --sign - dist/Dotcleaner.app
          codesign --verify --deep --strict dist/Dotcleaner.app
          test "$(plutil -extract CFBundleShortVersionString raw "$PLIST")" = "$VERSION"
      - name: Self-test of the app
        run: dist/Dotcleaner.app/Contents/MacOS/Dotcleaner --selftest
      - name: Build the .dmg
        run: |
          mkdir dmg
          cp -R dist/Dotcleaner.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Dotcleaner $VERSION" -srcfolder dmg -ov -format UDZO Dotcleaner-macOS.dmg
          echo "DMG=Dotcleaner-macOS.dmg" >> "$GITHUB_ENV"
      - name: Test the .dmg (mount it, run the app from it, unmount)
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/dcdmg "$DMG"
          /tmp/dcdmg/Dotcleaner.app/Contents/MacOS/Dotcleaner --selftest
          test -L /tmp/dcdmg/Applications
          hdiutil detach /tmp/dcdmg
          ls -lh "$DMG"
      - name: Screenshots (native macOS look)
        run: dist/Dotcleaner.app/Contents/MacOS/Dotcleaner --screenshots screenshots-macos
      - uses: actions/upload-artifact@v4
        with:
          name: dotcleaner-macos
          path: "*.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots-macos

  windows:
    name: Build .exe (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PySide6-Essentials pyinstaller
      - name: Build dotcleaner.exe (with version, product name and copyright)
        run: |
          python tools/win_version.py
          pyinstaller --noconfirm --onefile --windowed --name dotcleaner --icon assets/icon.ico --version-file build/version_info.txt --add-data "assets/icon.png;assets" app/dotcleaner_gui.py
      - name: Self-test of the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\dotcleaner.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed ($($p.ExitCode))"; exit 1 }
          $v = (Select-String -Path app\dotcleaner_core.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          Copy-Item dist\dotcleaner.exe Dotcleaner-Windows.exe
          $info = (Get-Item Dotcleaner-Windows.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileDescription, LegalCopyright
          if ($info.ProductVersion -ne $v -or $info.ProductName -ne 'Dotcleaner') { Write-Error "wrong version info"; exit 1 }
      - name: Screenshots (native Windows look)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\dotcleaner.exe -ArgumentList '--screenshots','screenshots-windows' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: dotcleaner-windows
          path: "*.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots-windows

  screenshots:
    name: Update README screenshots
    needs: [macos, windows]
    if: github.event_name == 'workflow_dispatch' && inputs.update_screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots-macos
      - run: python3 -m pip install pillow && python3 tools/montage.py screenshots-macos
      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app-*.png
          git diff --cached --quiet && { echo "Screenshots unchanged"; exit 0; }
          git commit -m "docs: update app screenshots (macOS)"
          git push
