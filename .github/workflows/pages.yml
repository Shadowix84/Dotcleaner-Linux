name: Website

# Publishes site/ (with the app screenshots) to GitHub Pages:
# https://shadowix84.github.io/Dotcleaner-Multi-Software/
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is GitHub Pages enabled?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled yet: Settings -> Pages -> Source: GitHub Actions, then run this workflow again."
          fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.enabled == 'true'
      - name: Assemble the site
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir _site
          cp -R site/. _site/
          cp docs/app-*.png docs/console-*.svg docs/social-preview.png assets/icon-256.png _site/
      - uses: actions/upload-pages-artifact@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          path: _site
      - name: Give GitHub a moment to register the upload
        if: steps.check.outputs.enabled == 'true'
        run: sleep 15
      - id: deploy
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
