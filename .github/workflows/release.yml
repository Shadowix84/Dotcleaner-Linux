name: Release

# One click: Actions -> Release -> Run workflow.
# Uses VERSION from dotcleaner.sh and the matching section of CHANGELOG.md,
# builds the apps (apps.yml) and attaches everything to the release.
# Title: "Dotcleaner x.y.z — <short title>" from the CHANGELOG heading "## [x.y.z] — date — <short title>".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apps:
    uses: ./.github/workflows/apps.yml
    permissions:          # what apps.yml may ask for (its screenshot job needs actions: write)
      contents: write
      actions: write

  release:
    needs: apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: v
        run: echo "version=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' dotcleaner.sh)" >> "$GITHUB_OUTPUT"

      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists. Bump VERSION in dotcleaner.sh and CHANGELOG.md first."
            exit 1
          fi

      - name: Run the tests
        run: sh tests/run_tests.sh

      - name: Release title and notes
        id: notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="[$VERSION]" '/^## \[/ { if (p) exit; if (index($0, v)) { p = 1; next } } p' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then echo "::error::No '## [$VERSION]' section in CHANGELOG.md"; exit 1; fi
          # "## [x.y.z] — date — Short title"  ->  "Dotcleaner x.y.z — Short title"
          subtitle=$(grep -m1 "^## \[$VERSION\]" CHANGELOG.md | awk -F ' — ' 'NF >= 3 { print $3 }')
          title="Dotcleaner $VERSION"
          if [ -n "$subtitle" ]; then title="$title — $subtitle"; fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          DL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main"
          REPO="https://github.com/$GITHUB_REPOSITORY"
          {
            echo "## ⬇️ Which file do I need?"
            echo
            echo "**You only need one file.** Pick the line that matches what you want to do:"
            echo
            echo "| I want to clean my card… | Download |"
            echo "| --- | --- |"
            echo "| 🍎 on my **Mac** (macOS 13+, Intel and Apple Silicon) | [**Dotcleaner-macOS.dmg**]($DL/Dotcleaner-macOS.dmg) |"
            echo "| 🪟 on my **Windows** PC (10 / 11) | [**Dotcleaner-Windows.exe**]($DL/Dotcleaner-Windows.exe) |"
            echo "| 🐧 on **Linux** (PC, Steam Deck) | [**Dotcleaner-Linux-x86_64**]($DL/Dotcleaner-Linux-x86_64) |"
            echo "| 🐧 on a **Raspberry Pi** (64-bit) | [**Dotcleaner-Linux-arm64**]($DL/Dotcleaner-Linux-arm64) |"
            echo "| 🎮 **on the console itself** — ArkOS, Knulli, Batocera, ROCKNIX, Onion… | [**Dotcleaner-console.zip**]($DL/Dotcleaner-console.zip) — its \`README.txt\` says where to copy it |"
            echo
            echo "The other files below are for advanced use, and *Source code* is added by GitHub: you can ignore them."
            echo
            echo "> **First launch of the app** — it is free and not signed with a paid certificate, so your computer asks once:"
            echo "> - **macOS:** System Settings → Privacy & Security → **Open Anyway**"
            echo "> - **Windows:** *Windows protected your PC* → **More info → Run anyway**"
            echo
            echo "## ✨ What's new in $VERSION"
            echo
            cat changes.md
            echo
            echo "<details>"
            echo "<summary><b>Advanced files</b> (terminal version, checksums)</summary>"
            echo
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| [dotcleaner.sh]($DL/dotcleaner.sh) | The terminal version alone: \`sh dotcleaner.sh\` (macOS, Linux, SSH on a console) |"
            echo "| [Dotcleaner-shell.zip]($DL/Dotcleaner-shell.zip) | The terminal version + \`dotcleaner.command\` to start it with a double-click on macOS |"
            echo "| [SHA256SUMS.txt]($DL/SHA256SUMS.txt) | Checksums: \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\` (macOS/Linux) or \`Get-FileHash\` (Windows) |"
            echo
            echo "Install the terminal version in one line: \`curl -fsSL $RAW/install.sh | sh\`"
            echo
            echo "</details>"
            echo
            echo "## 💬 Help"
            echo
            echo "[Guide and FAQ]($REPO#readme) · [Report a bug]($REPO/issues/new/choose) · [All changes]($REPO/blob/main/CHANGELOG.md)"
          } > notes.md
          cat notes.md

      - name: Build the terminal zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          dir="dotcleaner-$VERSION"
          mkdir "$dir"
          cp dotcleaner.sh dotcleaner.command install.sh README.md README.fr.md LICENSE "$dir/"
          chmod 755 "$dir/dotcleaner.sh" "$dir/dotcleaner.command" "$dir/install.sh"
          zip -r Dotcleaner-shell.zip "$dir"

      - name: Get the apps built by apps.yml (.dmg, .exe, Linux)
        uses: actions/download-artifact@v4
        with:
          pattern: dotcleaner-*
          merge-multiple: true
          path: apps

      - name: Checksums
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          (cd console && zip -r ../Dotcleaner-console.zip .)
          cp apps/Dotcleaner-macOS.dmg apps/Dotcleaner-Windows.exe apps/Dotcleaner-Linux-* .
          sha256sum Dotcleaner-macOS.dmg Dotcleaner-Windows.exe Dotcleaner-Linux-* Dotcleaner-console.zip \
            Dotcleaner-shell.zip dotcleaner.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt
          rm Dotcleaner-macOS.dmg Dotcleaner-Windows.exe Dotcleaner-Linux-*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.notes.outputs.title }}" \
            --notes-file notes.md \
            apps/Dotcleaner-macOS.dmg apps/Dotcleaner-Windows.exe apps/Dotcleaner-Linux-* Dotcleaner-console.zip \
            Dotcleaner-shell.zip dotcleaner.sh SHA256SUMS.txt

  tidy:
    needs: release
    uses: ./.github/workflows/tidy-releases.yml
    permissions:
      contents: write
