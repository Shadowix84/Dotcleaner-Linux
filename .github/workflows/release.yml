name: Release

# One click: Actions -> Release -> Run workflow.
# Uses VERSION from dotcleaner.sh and the matching section of CHANGELOG.md,
# builds the .dmg and .exe (apps.yml) and attaches everything to the release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apps:
    uses: ./.github/workflows/apps.yml

  release:
    needs: apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: v
        run: echo "version=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' dotcleaner.sh)" >> "$GITHUB_OUTPUT"

      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists. Bump VERSION in dotcleaner.sh and CHANGELOG.md first."
            exit 1
          fi

      - name: Run the tests
        run: sh tests/run_tests.sh

      - name: Release notes (download table, first launch, CHANGELOG section)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="[$VERSION]" '/^## \[/ { if (p) exit; if (index($0, v)) { p = 1; next } } p' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then echo "::error::No '## [$VERSION]' section in CHANGELOG.md"; exit 1; fi
          DL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main"
          {
            echo "## ⬇️ Download"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| 🍎 **macOS** (Apple Silicon) | [**Dotcleaner-macOS.dmg**]($DL/Dotcleaner-macOS.dmg) |"
            echo "| 🪟 **Windows** 10 / 11 | [**Dotcleaner-Windows.exe**]($DL/Dotcleaner-Windows.exe) |"
            echo "| ⌨️ **Shell** (macOS, Linux, consoles) | [dotcleaner.sh]($DL/dotcleaner.sh) · [zip with the double-click launcher]($DL/dotcleaner-$VERSION.zip) |"
            echo
            echo "Shell one-line install: \`curl -fsSL $RAW/install.sh | sh\`"
            echo
            echo "> **First launch** — the app is not signed with a paid certificate, so the system asks once:"
            echo "> - **macOS:** System Settings → Privacy & Security → **Open Anyway**"
            echo "> - **Windows:** *Windows protected your PC* → **More info → Run anyway**"
            echo
            echo "## ✨ What's new"
            echo
            cat changes.md
            echo
            echo "## 🔒 Checksums"
            echo
            echo "SHA-256 of every file in \`SHA256SUMS.txt\` — check with \`shasum -a 256 -c SHA256SUMS.txt\` (macOS/Linux) or \`Get-FileHash\` (Windows)."
          } > notes.md
          cat notes.md

      - name: Build the zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          dir="dotcleaner-$VERSION"
          mkdir "$dir"
          cp dotcleaner.sh dotcleaner.command install.sh README.md README.fr.md LICENSE "$dir/"
          chmod 755 "$dir/dotcleaner.sh" "$dir/dotcleaner.command" "$dir/install.sh"
          zip -r "$dir.zip" "$dir"

      - name: Get the .dmg and .exe built by apps.yml
        uses: actions/download-artifact@v4
        with:
          pattern: dotcleaner-*
          merge-multiple: true
          path: apps

      - name: Checksums
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cp apps/Dotcleaner-macOS.dmg apps/Dotcleaner-Windows.exe .
          sha256sum Dotcleaner-macOS.dmg Dotcleaner-Windows.exe "dotcleaner-$VERSION.zip" dotcleaner.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt
          rm Dotcleaner-macOS.dmg Dotcleaner-Windows.exe

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "dotcleaner $VERSION" \
            --notes-file notes.md \
            apps/Dotcleaner-macOS.dmg apps/Dotcleaner-Windows.exe \
            "dotcleaner-$VERSION.zip" dotcleaner.sh SHA256SUMS.txt
