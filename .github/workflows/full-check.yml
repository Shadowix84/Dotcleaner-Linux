name: Full check

# Every version, every engine, every shell: tests/full_check.py
# (static checks, 8 shells + BusyBox, deletion audits of the 3 engines, cross-engine
# comparison, extreme cards, interactive menu, desktop app, deliberate bugs).
# Runs every Monday and on demand: Actions -> Full check -> Run workflow.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  full-check:
    name: Full check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shells, BusyBox, ShellCheck and Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dash mksh posh yash ksh zsh busybox shellcheck \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: python -m pip install PySide6-Essentials
      - name: Full check
        run: python tests/full_check.py --cards 300 --seed ${{ github.run_number }}
