name: 🐞 Bug report
description: Something went wrong while cleaning a drive
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can — in English or in French.
        ⚠️ If a file was deleted that should not have been, please use **Security → Report a vulnerability** instead.
  - type: dropdown
    id: version_used
    attributes:
      label: Which Dotcleaner?
      options:
        - App on macOS (.dmg)
        - App on Windows (.exe)
        - App on Linux
        - Console launcher (Ports / Onion app)
        - Shell on macOS
        - Shell on Linux / WSL
        - Shell on the console (SSH)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the top of the app, or `dotcleaner --version`
      placeholder: "2.3.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: e.g. macOS 15.1 (M2), Windows 11, Ubuntu 24.04
  - type: input
    id: device
    attributes:
      label: Console, firmware and drive
      placeholder: e.g. R36S + ArkOS, 64 GB exFAT card
  - type: dropdown
    id: language
    attributes:
      label: App language
      options: [English, Français, Español, 中文, हिन्दी, "Not relevant (shell)"]
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Scan result, messages or screenshots
      description: |
        Console launcher: paste the content of `dotcleaner.log` (next to the launcher on the card).
        Shell: the output of `dotcleaner -n -v YOUR_DRIVE` helps a lot.
      render: text
